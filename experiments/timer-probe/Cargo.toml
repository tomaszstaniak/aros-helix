[package]
name = "timer-probe"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "timer-probe"
path = "src/main.rs"

[dependencies]
# The features hx enables (helix-event, helix-lsp, helix-view).
tokio = { version = "=1.46.1", features = ["rt", "rt-multi-thread", "time", "sync", "parking_lot", "macros"] }
parking_lot = "=0.12.4"
parking_lot_core = "=0.9.11"
libc = "0.2"

[workspace]
